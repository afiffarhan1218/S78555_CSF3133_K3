<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Exercise 3 - Contact & Calculator</title>
</head>
<body>

    <!-- 1. Header Section -->
    <div id="header">
        <h1>Luxury Watch Business <span style="font-size: 16px; font-weight: normal;">- Timeless Elegance</span></h1>
    </div>

    <!-- 2. Content Section: Contact Form and Inline Calculator -->
    <div id="content">
        
        <!-- Contact Form -->
        <h2>Contact Us</h2>
        <form action="">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" placeholder="Enter your email" required>
            <br><br>

            <label for="tarikh">Preferred Contact Date:</label>
            <input type="date" id="tarikh" name="tarikh">
            <br><br>

            <label for="satisfaction">Satisfaction Level:</label>
            <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" value="5">
            <br><br>

            <input type="submit" value="Hantar">
        </form>

        <hr>

        <!-- Inline Calculator (using <output>) -->
        <h2>Inline Calculator</h2>
        <form oninput="z.value = parseInt(num1.value) + parseInt(num2.value)">
            <input type="number" id="num1" value="0"> +
            <input type="number" id="num2" value="0"> =
            <output name="z" for="num1 num2">0</output>
        </form>

    </div>

    <!-- 3. Footer Section -->
    <div id="footer">
        <p>&copy; 2026 Luxury Watch Business. All rights reserved.</p>
    </div>

</body>
</html>
