<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section with title and instructions -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <!-- Player registration section (div avoids missing-heading warning) -->
    <div class="card" id="playerSection">
        <label for="playerName"><strong>Your name:</strong></label>
        <input type="text" id="playerName" placeholder="Enter your name">
        <button onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </div>

    <!-- Main gameplay section with choice buttons and image display -->
    <div class="card" id="gameSection">
        <div class="controls">
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>
        </div>

        <div class="arena">
            <div class="choice-box">
                <!-- Changed from h3 to h2 so heading hierarchy follows h1 -> h2 -->
                <h2>You</h2>
                <img id="playerImg" src="rock.png" alt="Player Choice">
            </div>
            <div class="vs-text">VS</div>
            <div class="choice-box">
                <h2>Computer</h2>
                <img id="computerImg" src="rock.png" alt="Computer Choice">
            </div>
        </div>
    </div>

    <!-- Result and scoreboard section -->
    <div class="card" id="resultSection">
        <p id="result"></p>
        <div class="scoreboard">
            <span>Wins: <strong id="wins">0</strong></span>
            <span>Losses: <strong id="losses">0</strong></span>
            <span>Draws: <strong id="draws">0</strong></span>
        </div>
        <p id="summaryText"></p>
    </div>

    <!-- Round history table and action controls (keeps section since it has an h2) -->
    <section class="card" id="historySection">
        <h2>History</h2>
        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- Round rows will be inserted here dynamically -->
            </tbody>
        </table>

        <div class="bottom-controls">
            <button onclick="showSummary()">Show Summary</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </section>

    <!-- Footer section displaying start timestamp and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
