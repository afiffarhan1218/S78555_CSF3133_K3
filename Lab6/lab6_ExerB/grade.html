<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Changed from h2 to h1 so the page starts with a top-level heading -->
    <h1>Student Grade Calculator</h1>

    <!-- Form card with onsubmit returning checkMark() to prevent page reload -->
    <div class="card">
        <form name="gradeForm" onsubmit="return checkMark()">
            <label for="name"><strong>Name:</strong></label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="mark"><strong>Mark (0-100):</strong></label><br>
            <input type="text" id="mark" name="mark"><br><br>

            <button type="submit">Check Grade</button>
            <!-- Random Mark button (type="button" prevents accidental form submission) -->
            <button type="button" onclick="generateRandomMark()">Random Mark</button>
        </form>
    </div>

    <!-- Output section for grade result and timestamp -->
    <p id="result"></p>
    <p id="checkedTime"></p>

    <!-- Button and container for the grade reference table -->
    <button onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>

    <!-- Corrected script filename from grades.js to grade.js -->
    <script src="grade.js"></script>
</body>
</html>
